<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  {% block title %}
  {% endblock %}


</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid justify-content-center">
        <div>
            <!-- me-3 adds space to the right of the button -->
            <a href="{% url 'home' %}" class="btn btn-primary me-3" role="button">Home</a>
            <a class="btn btn-warning me-3" role="button" href="{% url 'create-user' %}">Register</a>

            {% if not user.is_authenticated %}
            <a class="btn btn-info" role="button" href="{% url 'user-login' %}">Login</a>
            <a class="btn btn-secondary" role="button" href="{% url 'reset-password' %}">Reset Password</a>
            {% else %}
            <a class="btn btn-danger" role="button" href="{% url 'user-logout' %}">Logout</a>
            <a class="btn btn-info" role="button" href="{% url 'display-details' %}">Details</a>
            <a class="btn btn-secondary" role="button" href="{% url 'change-password' %}">Change Password</a>
            {% endif %}
        </div>
    </div>
</nav>

  {% block body %}
  {% endblock %}
</body>

</html>
