<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Web Page</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f4f4f4;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>

</head>

<body>
    <center>
        <h1><i>~~ Create Web Pages ~~</i></h1>
        <form method="POST">
            {% csrf_token %}
            <table border="3px">
                <tr>
                    <td>
                        <label for="topic">Topic Name: </label>
                        <select name="tn" id="tn">
                            {% for to in TO %}
                            <option value="{{ to.topic_name }}">{{ to.topic_name }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" placeholder="Sara">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="url">Url: </label>
                        <input type="text" name="url" id="url" placeholder="https://hello.com">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="email">Email: </label>
                        <input type="email" name="email" id="name" placeholder="example@gmail.com">
                    </td>

                </tr>
                <tr>
                    <td>
                        <label for="phone">Phone: </label>
                        <input type="number" name="number" id="number" placeholder="+91 XXXXX XXXXX">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" value="Create">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>

</html>
