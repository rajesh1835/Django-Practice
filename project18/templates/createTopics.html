<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Topics</title>
</head>

<body>
    <center>
        <h2><i>~~ Create Topic ~~</i></h2>
        <form method="POST">
            {% csrf_token %}
            <table>
                <tr>
                    <td>
                        <label for="tname">Topic Name:</label>
                        <input type="text" name="tname" id="tname">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" value="Submit">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>

</html>
